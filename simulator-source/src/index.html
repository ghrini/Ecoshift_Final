<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>/*__CSS__*/</style>
<nav id="fs-backrow" hidden><a id="fs-back" class="fs-backlink" href="../index.html">← Back to EcoShift</a></nav>
<header id="fs-header">
  <h1 class="fs-adjust-title"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Adjust These Settings</h1>
  <button type="button" id="fs-farm-btn" class="fs-farm-btn"><span class="fs-farm-name">Your farm</span><span aria-hidden="true"> · </span><span class="fs-farm-change">Change</span></button>
  <div class="fs-run-wrap">
    <button type="button" id="fs-run" class="fs-btn-primary">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
      Run Simulation<i id="fs-dirty" class="fs-rundot" hidden aria-hidden="true"></i><span class="fs-sr" id="fs-dirty-sr" hidden>(changes not run yet)</span>
    </button>
  </div>
</header>
<main id="fs-app">
  <div id="fs-left">
    <div class="fs-ctl-row">
      <section class="fs-panel" id="fs-ctl-weather" aria-label="Weather and season"></section>
      <section class="fs-panel" id="fs-ctl-crops" aria-label="Crops"></section>
      <section class="fs-panel" id="fs-ctl-other" aria-label="Other conditions"></section>
    </div>
    <section class="fs-panel" id="fs-view-panel" aria-label="Simulation">
      <div class="fs-panel-head"><h2 class="fs-panel-title">Simulation</h2><div class="fs-head-right"><button type="button" class="fs-expand" data-expand="Simulation" aria-label="Expand Simulation"><svg class="ic-expand" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg><svg class="ic-collapse" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10h-6V4M4 14h6v6M14 10l7-7M10 14l-7 7"/></svg></button></div></div>
      <div class="fs-panel-body fs-view-body"><section id="fs-view" aria-label="Bird's eye view of the farm"></section></div>
    </section>
  </div>
  <div id="fs-right">
    <section class="fs-panel" id="fs-analysis" aria-label="Sim analysis"></section>
    <section class="fs-panel" id="fs-chat" aria-label="Chat"></section>
  </div>
</main>
<section class="fs-panel" id="fs-outlook" aria-label="Next 30 days"></section>
<footer id="fs-foot" class="fs-foot-line"></footer>
<div id="fs-setup" class="fs-setup" hidden></div>
