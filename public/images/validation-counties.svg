<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 616" width="100%" role="img" aria-labelledby="t d" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">
<title id="t">Model skill against a trend-only guess in 14 counties, corn and soybean</title>
<desc id="d">Horizontal grouped bars, one row per county, of model skill against a trend-only guess when the Iowa-fitted model is applied to that county with no refit. Skill is 1 minus the model error divided by the trend-only error, so zero means no better than the trend and below zero means worse. Corn skill is above zero in 14 of 14 counties but 0.10 or more in only 9 (median +0.14); soybean is above zero in 13 and 0.10 or more in 8 (median +0.11). The thin line on each bar is the 95 percent interval; most intervals reach below zero.</desc>
