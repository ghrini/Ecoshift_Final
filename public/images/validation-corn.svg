<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" role="img" aria-labelledby="t d" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">
<title id="t">Real Iowa corn harvests against the EcoShift model, 1982-2025</title>
<desc id="d">Line chart, one point per season from 1982 to 2025, of corn harvest as a percent of the yield trend. One line is the real USDA NASS Iowa state yield; the other is the model prediction made with each season left out of the fitting. The model dips in the two big droughts, 1988 (real 67, model 80) and 2012 (real 76, model 80), but underestimates how bad 1988 was and misses the 1993 flood entirely (real 59, model 84). In ordinary years the model line stays close to 100 and does not follow the real ups and downs, so it is no better than the yield trend. Correlation over all 44 seasons is 0.48.</desc>
